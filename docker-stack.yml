# Swarm stack for kittens.cyberask.co.uk.
# Traefik on caprod01 sends Host(`kittens.cyberask.co.uk`) to kittens_nginx:80
# over the ca_public overlay. This file publishes no host ports: caprod01
# already binds 80 and 443 for Traefik.
# One replica. SQLite and HLS files stay on the pinned node's local volume.
# KITTEN_WEB_IMAGE, KITTEN_SWARM_NODE, and the secret env vars are supplied
# at deploy time from /root/ca_kitten_cam on build01. They are not in git.

services:
  nginx:
    image: nginx:1.27-alpine
    configs:
      - source: kitten_nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - default
      - ca_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${KITTEN_SWARM_NODE}
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        failure_action: rollback
        monitor: 30s
        order: stop-first

  web:
    image: ${KITTEN_WEB_IMAGE}
    env_file:
      - .env
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SEED_RTSP_URL: "${SEED_RTSP_URL}"
      SEED_FEED_NAME: "${SEED_FEED_NAME}"
      SESSION_COOKIE_SECURE: "true"
      DB_PATH: /data/feeds.db
      HLS_ROOT: /data/hls
    volumes:
      - kitten_data:/data
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 25s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${KITTEN_SWARM_NODE}
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        failure_action: rollback
        monitor: 40s
        order: stop-first

configs:
  kitten_nginx_conf:
    file: ./nginx/default.conf

networks:
  default:
    driver: overlay
    attachable: true
  ca_public:
    external: true

volumes:
  kitten_data:
