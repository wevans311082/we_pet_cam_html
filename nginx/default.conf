server {
    listen 80;
    server_name kittens.cyberask.co.uk _;

    client_max_body_size 10m;

    # Embedded DNS. A variable upstream is re-resolved after a task moves.
    # kittens_web is this stack's service. The short name "web" also exists
    # on the shared ca_public overlay and must not be used here.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Flask app (viewer + admin UI + HLS files)
    location / {
        set $kitten_upstream kittens_web:8000;
        proxy_pass http://$kitten_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
